<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サブネット分割 — tayooo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237e8e9e'/%3E%3Ccircle cx='50' cy='62' r='20' fill='%23FFF3E2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--sky:#7e8e9e;--mauve:#857a80;--salmon:#e18c6d;--brown:#875e5c;--ink:#23233F;--paper:#FAF5EE;--grid:rgba(225,140,109,.28);--accent:#C9502E;}
  @font-face{font-family:"DT Getai Grotesk Display";src:url("../../fonts/DTGetaiGroteskDisplay-Black.woff") format("woff");font-weight:900;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{overflow-x:hidden;}
  body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;background:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),var(--paper);background-size:26px 26px;color:var(--ink);-webkit-font-smoothing:antialiased;}
  a{text-decoration:none;color:inherit;}
  .wrap{max-width:880px;margin:0 auto;padding:30px 32px 40px;}
  .hero{background:linear-gradient(180deg,#7e8e9e 0%,#857a80 58%,#e18c6d 100%);border:2.5px solid var(--ink);border-radius:20px;box-shadow:9px 9px 0 var(--ink);padding:26px 38px 0;color:#fff;overflow:hidden;position:relative;}
  .hero .kicker{font-family:Consolas,monospace;font-size:12px;letter-spacing:.35em;font-weight:700;color:#FFF1E2;}
  .hero .back{position:absolute;top:24px;right:38px;font-size:12.5px;font-weight:700;color:#FFF1E2;}
  .hero h1{font-family:"DT Getai Grotesk Display","Noto Sans JP",sans-serif;font-size:44px;font-weight:900;line-height:1.05;margin-top:6px;color:#fff;}
  .hero h1 .dot{color:#FFD9AE;}
  .hero p{margin-top:8px;font-size:14px;font-weight:700;color:#FFF6EC;}
  .mountains{display:block;width:calc(100% + 76px);margin:10px -38px 0;height:60px;}
  footer{margin-top:40px;text-align:center;font-family:Consolas,monospace;font-size:11.5px;letter-spacing:.18em;color:#A79BA8;}
  @media (max-width:700px){.wrap{padding:16px 14px 26px;}.hero{padding:18px 20px 0;box-shadow:6px 6px 0 var(--ink);border-radius:16px;}.hero .back{top:16px;right:20px;}.hero h1{font-size:30px;}.mountains{width:calc(100% + 40px);margin:6px -20px 0;height:44px;}}

  .card{background:#fff;border:2.5px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink);padding:24px;margin-top:28px;}
  .card h2{font-size:12px;font-weight:900;letter-spacing:.3em;color:#A79BA8;margin-bottom:18px;}
  @media (max-width:700px){.card{padding:18px 14px;}}

  .field{margin-bottom:22px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:12px;font-weight:900;letter-spacing:.14em;color:#6E6A7E;margin-bottom:8px;}
  input[type=text]{width:100%;font-family:Consolas,"Courier New",monospace;font-size:19px;font-weight:700;color:var(--ink);border:2.5px solid var(--ink);border-radius:10px;padding:11px 14px;background:#FFFDF9;outline:none;letter-spacing:.03em;}
  input[type=text]:focus{border-color:var(--accent);}
  input[type=text]::placeholder{color:#C4BBAE;font-weight:500;}
  input[type=text].bad{border-color:var(--accent);background:#FFF1E8;}
  .err{display:none;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--accent);}
  .err.on{display:block;}
  .hint{margin-top:8px;font-size:12.5px;color:#A79BA8;font-weight:500;}

  .prefixrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .prefixbig{font-family:Consolas,monospace;font-size:34px;font-weight:700;line-height:1;min-width:86px;}
  .prefixbig small{font-size:15px;color:#A79BA8;}
  .prefixmeta{font-family:Consolas,monospace;font-size:13px;color:#A79BA8;font-weight:700;}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1 1 200px;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--salmon),var(--sky));border:2px solid var(--ink);outline:none;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:pointer;}

  .summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px;}
  .stat{flex:1 1 150px;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);padding:12px 16px;text-align:center;}
  .stat .k{font-size:10.5px;font-weight:900;letter-spacing:.24em;color:#A79BA8;}
  .stat .v{font-family:Consolas,monospace;font-size:23px;font-weight:700;margin-top:3px;}
  .stat .v small{font-size:13px;color:#A79BA8;}

  .srow{display:flex;align-items:flex-start;gap:12px;padding:12px 2px;border-bottom:2px dashed #E4DCCF;}
  .srow:last-child{border-bottom:none;}
  .srow .no{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-family:Consolas,monospace;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px;}
  .srow .body{flex:1;min-width:0;}
  .srow .cidr{font-family:Consolas,monospace;font-size:17.5px;font-weight:700;}
  .srow .cidr .pfx{color:var(--accent);}
  .srow .sub{font-family:Consolas,monospace;font-size:12.5px;color:#6E6A7E;margin-top:3px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word;}
  .csvrow{display:flex;justify-content:flex-end;margin:14px 0 4px;}
  .csvbtn{font-family:"Noto Sans JP",sans-serif;font-size:13.5px;font-weight:900;border:2.5px solid var(--ink);border-radius:999px;padding:8px 22px;cursor:pointer;box-shadow:3.5px 3.5px 0 var(--ink);background:var(--accent);color:#fff;transition:transform .1s ease,box-shadow .1s ease;}
  .csvbtn:hover{transform:translate(1px,1px);box-shadow:2.5px 2.5px 0 var(--ink);}
  .csvbtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);}
  .csvbtn:disabled{opacity:.45;cursor:default;transform:none;}
  .copy{flex:none;font-family:"Noto Sans JP",sans-serif;font-size:11px;font-weight:900;border:2px solid var(--ink);border-radius:999px;padding:3px 12px;background:#fff;cursor:pointer;box-shadow:2px 2px 0 var(--ink);margin-top:4px;}
  .copy:hover{background:#FFE9DC;}
  .copy.done{background:var(--accent);color:#fff;}
  .note{margin-top:14px;font-size:12.5px;color:#A79BA8;font-weight:500;line-height:1.7;}
  .empty{padding:26px 10px;text-align:center;color:#A79BA8;font-weight:700;font-size:14px;}
  @media (max-width:700px){.srow .cidr{font-size:15.5px;}.stat .v{font-size:19px;}}
</style>
</head>

<body>
<div class="wrap">
  <div class="hero">
    <div class="kicker">TOOL/SUBNET-SPLIT</div>
    <a class="back" href="/tool/">← tool 一覧</a>
    <h1>subnet split<span class="dot">.</span></h1>
    <p>ネットワークを、指定したサブネット長で均等に分割する。</p>
    <svg class="mountains" viewBox="0 0 1000 140" preserveAspectRatio="xMidYMax slice" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="806" cy="86" r="17" fill="#FFD9AE" stroke="none" opacity="0.95"/>
      <path d="M-10,116 L170,116 L246,80 L298,102 L362,60 L428,98 L498,54 L562,90 L632,48 L706,94 L772,66 L852,104 L922,84 L1010,108" stroke="#FFF3E2" stroke-width="2" opacity="0.45"/>
      <path d="M-10,128 L236,128 L318,88 L372,108 L442,70 L522,110 L598,64 L672,104 L740,80 L816,114 L884,94 L1010,118" stroke="#FFF3E2" stroke-width="2.4" opacity="0.95"/>
    </svg>
  </div>

  <div class="card">
    <h2>INPUT — 入力</h2>
    <div class="field">
      <label for="ipInput">ネットワークアドレス（IPv4）</label>
      <input type="text" id="ipInput" value="192.168.0.0" placeholder="192.168.0.0" inputmode="decimal" autocomplete="off" spellcheck="false">
      <div class="err" id="ipErr">IPアドレスの形式が正しくありません（例：192.168.0.0）</div>
      <div class="hint" id="baseHint"></div>
    </div>
    <div class="field">
      <label>元のプレフィックス長</label>
      <div class="prefixrow">
        <div class="prefixbig"><small>/</small><span id="origNum">24</span></div>
        <input type="range" id="origRange" min="0" max="32" step="1" value="24">
        <div class="prefixmeta" id="origMask"></div>
      </div>
    </div>
    <div class="field">
      <label>分割後のプレフィックス長</label>
      <div class="prefixrow">
        <div class="prefixbig"><small>/</small><span id="newNum">26</span></div>
        <input type="range" id="newRange" min="0" max="32" step="1" value="26">
        <div class="prefixmeta" id="newMask"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>SPLIT — 分割結果</h2>
    <div class="summary">
      <div class="stat"><div class="k">分割数</div><div class="v" id="statCount">—</div></div>
      <div class="stat"><div class="k">借りるビット</div><div class="v" id="statBits">—</div></div>
      <div class="stat"><div class="k">1つあたりのホスト数</div><div class="v" id="statHosts">—</div></div>
    </div>
    <div class="csvrow"><button class="csvbtn" id="csvBtn">CSVをダウンロード</button></div>
    <div id="list"></div>
    <p class="note" id="listNote"></p>
  </div>

  <footer><a href="/">© 2026 TAYOOO</a></footer>
</div>

<script>
  const ipInput = document.getElementById('ipInput');
  const ipErr = document.getElementById('ipErr');
  const baseHint = document.getElementById('baseHint');
  const origRange = document.getElementById('origRange');
  const newRange = document.getElementById('newRange');
  const origNum = document.getElementById('origNum');
  const newNum = document.getElementById('newNum');
  const origMask = document.getElementById('origMask');
  const newMask = document.getElementById('newMask');
  const listEl = document.getElementById('list');
  const listNote = document.getElementById('listNote');
  const DISPLAY_MAX = 512;
  let orig = 24, nw = 26;

  function parseIp(str) {
    const parts = String(str).trim().split('.');
    if (parts.length !== 4) return null;
    let n = 0;
    for (const part of parts) {
      if (!/^\d{1,3}$/.test(part)) return null;
      const v = Number(part);
      if (v > 255) return null;
      n = n * 256 + v;
    }
    return n >>> 0;
  }
  function toIp(n) { return [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join('.'); }
  function maskFromPrefix(p) { return p === 0 ? 0 : (0xFFFFFFFF << (32 - p)) >>> 0; }
  function fmt(n) { return n.toLocaleString('ja-JP'); }
  function usableHosts(p) {
    if (p <= 30) return Math.pow(2, 32 - p) - 2;
    if (p === 31) return 2;
    return 1;
  }

  function syncBars() {
    origNum.textContent = orig;
    newNum.textContent = nw;
    origRange.value = orig;
    newRange.value = nw;
    origMask.textContent = toIp(maskFromPrefix(orig));
    newMask.textContent = toIp(maskFromPrefix(nw));
  }

  function render() {
    syncBars();
    const ip = parseIp(ipInput.value);
    const ok = ip !== null && ipInput.value.trim() !== '';
    ipErr.classList.toggle('on', !ok);
    ipInput.classList.toggle('bad', !ok);
    if (!ok) {
      csvBtn.disabled = true;
      baseHint.textContent = '';
      listEl.innerHTML = '<div class="empty">IPアドレスを入力すると、分割結果が表示されます</div>';
      listNote.textContent = '';
      document.getElementById('statCount').textContent = '—';
      document.getElementById('statBits').textContent = '—';
      document.getElementById('statHosts').textContent = '—';
      return;
    }
    const base = (ip & maskFromPrefix(orig)) >>> 0;
    csvBtn.disabled = false;
    baseHint.textContent = ip === base ? '' : '※ 入力されたIPから、ネットワーク ' + toIp(base) + '/' + orig + ' として計算しています';

    const bits = nw - orig;
    const count = Math.pow(2, bits);
    const size = Math.pow(2, 32 - nw);
    document.getElementById('statCount').innerHTML = fmt(count) + '<small> 個</small>';
    document.getElementById('statBits').innerHTML = bits + '<small> bit</small>';
    document.getElementById('statHosts').innerHTML = fmt(usableHosts(nw)) + '<small> 台</small>';

    const show = Math.min(count, DISPLAY_MAX);
    let html = '';
    for (let i = 0; i < show; i++) {
      const net = (base + i * size) >>> 0;
      const bc = (net + size - 1) >>> 0;
      let first, last;
      if (nw <= 30) { first = net + 1; last = bc - 1; }
      else { first = net; last = bc; }
      html += '<div class="srow"><div class="no">' + (i + 1) + '</div><div class="body">' +
        '<div class="cidr">' + toIp(net) + '<span class="pfx">/' + nw + '</span></div>' +
        '<div class="sub">ホスト ' + toIp(first) + ' 〜 ' + toIp(last) + '</div>' +
        '<div class="sub">BC ' + toIp(bc) + '</div></div>' +
        '<button class="copy" data-cidr="' + toIp(net) + '/' + nw + '">コピー</button></div>';
    }
    listEl.innerHTML = html;
    let note = '';
    if (count > DISPLAY_MAX) note += '※ 全 ' + fmt(count) + ' 件のうち、先頭 ' + DISPLAY_MAX + ' 件まで表示しています。';
    if (count > CSV_MAX) note += (note ? ' ' : '') + '※ CSVは先頭 ' + fmt(CSV_MAX) + ' 件まで出力します。';
    if (nw >= 31) note += (note ? ' ' : '') + '※ /31・/32 ではネットワーク／ブロードキャストもホストとして数えています。';
    listNote.textContent = note;
  }

  const CSV_MAX = 65536;
  const csvBtn = document.getElementById('csvBtn');
  csvBtn.addEventListener('click', () => {
    const ip = parseIp(ipInput.value);
    if (ip === null || ipInput.value.trim() === '') return;
    const base = (ip & maskFromPrefix(orig)) >>> 0;
    const count = Math.pow(2, nw - orig);
    const size = Math.pow(2, 32 - nw);
    const maskStr = toIp(maskFromPrefix(nw));
    const rows = Math.min(count, CSV_MAX);
    let csv = '\uFEFF' + 'No,ネットワークアドレス,プレフィックス長,サブネットマスク,ホスト範囲（最初）,ホスト範囲（最後）,ブロードキャストアドレス,使用可能なホスト数\n';
    for (let i = 0; i < rows; i++) {
      const net = (base + i * size) >>> 0;
      const bc = (net + size - 1) >>> 0;
      let first, last;
      if (nw <= 30) { first = net + 1; last = bc - 1; } else { first = net; last = bc; }
      csv += (i + 1) + ',' + toIp(net) + ',' + nw + ',' + maskStr + ',' + toIp(first) + ',' + toIp(last) + ',' + toIp(bc) + ',' + usableHosts(nw) + '\n';
    }
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'subnets-' + toIp(base) + '-' + orig + '-to-' + nw + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });

  listEl.addEventListener('click', e => {
    const btn = e.target.closest('.copy');
    if (!btn) return;
    const done = () => { btn.textContent = '✓'; btn.classList.add('done'); setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('done'); }, 1100); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(btn.dataset.cidr).then(done).catch(done);
    else done();
  });

  ipInput.addEventListener('input', render);
  origRange.addEventListener('input', () => { orig = Number(origRange.value); if (nw < orig) nw = orig; render(); });
  newRange.addEventListener('input', () => { nw = Number(newRange.value); if (nw < orig) nw = orig; render(); });
  render();
</script>
<script src="/season.js" defer></script>
</body>
</html>
