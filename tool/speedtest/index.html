<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スピードテスト — tayooo</title>
<meta name="description" content="今の回線のPing・下り・上り速度をブラウザで計測するスピードテスト。計測履歴も残る。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237e8e9e'/%3E%3Ccircle cx='50' cy='62' r='20' fill='%23FFF3E2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--sky:#7e8e9e;--mauve:#857a80;--salmon:#e18c6d;--brown:#875e5c;--ink:#23233F;--paper:#FAF5EE;--grid:rgba(225,140,109,.28);--accent:#C9502E;}
  @font-face{font-family:"DT Getai Grotesk Display";src:url("/fonts/DTGetaiGroteskDisplay-Black.woff") format("woff");font-weight:900;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{overflow-x:hidden;}
  body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;background:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),var(--paper);background-size:26px 26px;color:var(--ink);-webkit-font-smoothing:antialiased;}
  a{text-decoration:none;color:inherit;}
  .wrap{max-width:880px;margin:0 auto;padding:30px 32px 40px;}
  .hero{background:linear-gradient(180deg,#7e8e9e 0%,#857a80 58%,#e18c6d 100%);border:2.5px solid var(--ink);border-radius:20px;box-shadow:9px 9px 0 var(--ink);padding:26px 38px 0;color:#fff;overflow:hidden;position:relative;}
  .hero .kicker{font-family:Consolas,monospace;font-size:12px;letter-spacing:.35em;font-weight:700;color:#FFF1E2;}
  .hero .back{position:absolute;top:24px;right:38px;font-size:12.5px;font-weight:700;color:#FFF1E2;}
  .hero h1{font-family:"DT Getai Grotesk Display","Noto Sans JP",sans-serif;font-size:44px;font-weight:900;line-height:1.05;margin-top:6px;color:#fff;}
  .hero h1 .dot{color:#FFD9AE;}
  .hero p{margin-top:8px;font-size:14px;font-weight:700;color:#FFF6EC;}
  .mountains{display:block;width:calc(100% + 76px);margin:10px -38px 0;height:60px;}
  footer{margin-top:40px;text-align:center;font-family:Consolas,monospace;font-size:11.5px;letter-spacing:.18em;color:#A79BA8;}
  @media (max-width:700px){.wrap{padding:16px 14px 26px;}.hero{padding:18px 20px 0;box-shadow:6px 6px 0 var(--ink);border-radius:16px;}.hero .back{top:16px;right:20px;}.hero h1{font-size:30px;}.mountains{width:calc(100% + 40px);margin:6px -20px 0;height:44px;}}

  .card{background:#fff;border:2.5px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink);padding:24px;margin-top:28px;}
  .card h2{font-size:12px;font-weight:900;letter-spacing:.3em;color:#A79BA8;margin-bottom:18px;}
  @media (max-width:700px){.card{padding:18px 14px;}}

  .gauge{border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);padding:20px 16px 16px;text-align:center;}
  .gauge .phaserow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .gauge .phase{font-size:11px;font-weight:900;letter-spacing:.3em;color:#A79BA8;min-height:14px;text-align:left;}
  .gauge .pct{font-family:Consolas,monospace;font-size:15px;font-weight:700;color:var(--accent);}
  .gauge .graphbox{margin-top:12px;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:8px 10px 4px;}
  .gauge .graphbox canvas{display:block;width:100%;height:92px;}
  .gauge .legend{display:none;gap:16px;justify-content:center;padding:5px 0 3px;font-size:11px;font-weight:700;color:#6E6A7E;}
  .gauge .legend.on{display:flex;}
  .gauge .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;border:1.5px solid var(--ink);}
  .gauge .big{font-family:Consolas,monospace;font-size:64px;font-weight:700;line-height:1.1;margin-top:4px;}
  .gauge .big small{font-size:20px;color:#A79BA8;}
  .gauge .bar{height:10px;border:2px solid var(--ink);border-radius:99px;background:#fff;margin-top:14px;overflow:hidden;}
  .gauge .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--salmon),var(--accent));transition:width .25s ease;}
  @media (max-width:700px){.gauge .big{font-size:46px;}}

  .controls{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
  .btn{font-family:"Noto Sans JP",sans-serif;font-size:15px;font-weight:900;border:2.5px solid var(--ink);border-radius:999px;padding:10px 30px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .1s ease,box-shadow .1s ease;background:#fff;color:var(--ink);}
  .btn:hover{transform:translate(1px,1px);box-shadow:3px 3px 0 var(--ink);}
  .btn.main{background:var(--accent);color:#fff;min-width:190px;}
  .btn:disabled{opacity:.55;cursor:default;transform:none;}

  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;}
  .stat{flex:1 1 120px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;padding:12px 10px;text-align:center;}
  .stat.on{background:var(--paper);border-color:var(--accent);}
  .stat .k{font-size:10.5px;font-weight:900;letter-spacing:.2em;color:#A79BA8;}
  .stat .v{font-family:Consolas,monospace;font-size:24px;font-weight:700;margin-top:3px;}
  .stat .v small{font-size:12px;color:#A79BA8;}

  .hrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:2px dashed #E4DCCF;font-family:Consolas,monospace;}
  .hrow:last-child{border-bottom:none;}
  .hrow .date{flex:0 0 118px;font-size:12.5px;color:#6E6A7E;font-weight:700;}
  .hrow .vals{flex:1;display:flex;gap:14px;flex-wrap:wrap;font-size:14px;font-weight:700;}
  .hrow .vals span b{color:var(--accent);font-weight:700;}
  .hrow .vals .lab{font-family:"Noto Sans JP",sans-serif;font-size:10.5px;color:#A79BA8;font-weight:900;margin-right:3px;}
  .empty{padding:22px 10px;text-align:center;color:#A79BA8;font-weight:700;font-size:14px;}
  .histhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .histhead h2{margin-bottom:0;}
  .clearbtn{font-family:"Noto Sans JP",sans-serif;font-size:11.5px;font-weight:900;border:2px solid var(--ink);border-radius:999px;padding:4px 14px;background:#fff;cursor:pointer;box-shadow:2px 2px 0 var(--ink);}
  .clearbtn:hover{background:#FFE9DC;}
  .note{margin-top:14px;font-size:12.5px;color:#A79BA8;font-weight:500;line-height:1.7;}
  @media (max-width:700px){.hrow .date{flex-basis:96px;font-size:11.5px;}.hrow .vals{font-size:13px;gap:10px;}}
</style>
</head>

<body>
<div class="wrap">
  <div class="hero">
    <div class="kicker">TOOL/SPEEDTEST</div>
    <a class="back" href="/tool/">← tool 一覧</a>
    <h1>speedtest<span class="dot">.</span></h1>
    <p>今の回線の、Ping・下り・上りの速度を測る。</p>
    <svg class="mountains" viewBox="0 0 1000 140" preserveAspectRatio="xMidYMax slice" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="806" cy="86" r="17" fill="#FFD9AE" stroke="none" opacity="0.95"/>
      <path d="M-10,116 L170,116 L246,80 L298,102 L362,60 L428,98 L498,54 L562,90 L632,48 L706,94 L772,66 L852,104 L922,84 L1010,108" stroke="#FFF3E2" stroke-width="2" opacity="0.45"/>
      <path d="M-10,128 L236,128 L318,88 L372,108 L442,70 L522,110 L598,64 L672,104 L740,80 L816,114 L884,94 L1010,118" stroke="#FFF3E2" stroke-width="2.4" opacity="0.95"/>
    </svg>
  </div>

  <div class="card">
    <h2>SPEED TEST — 計測</h2>
    <div class="gauge">
      <div class="phaserow"><div class="phase" id="phase">READY</div><div class="pct" id="pct"></div></div>
      <div class="big"><span id="bigNum">—</span><small id="bigUnit"></small></div>
      <div class="bar"><i id="barFill"></i></div>
      <div class="graphbox"><canvas id="graph" width="640" height="184"></canvas><div class="legend" id="legend"><span><i style="background:#E18C6D"></i>下り</span><span><i style="background:#7E8E9E"></i>上り</span></div></div>
    </div>
    <div class="stats">
      <div class="stat" id="stPing"><div class="k">PING</div><div class="v" id="vPing">—<small> ms</small></div></div>
      <div class="stat" id="stJitter"><div class="k">JITTER</div><div class="v" id="vJitter">—<small> ms</small></div></div>
      <div class="stat" id="stDown"><div class="k">DOWNLOAD</div><div class="v" id="vDown">—<small> Mbps</small></div></div>
      <div class="stat" id="stUp"><div class="k">UPLOAD</div><div class="v" id="vUp">—<small> Mbps</small></div></div>
    </div>
    <div class="controls">
      <button class="btn main" id="startBtn">測定を開始する</button>
      <button class="btn" id="stopBtn" disabled>中止</button>
    </div>
    <p class="note">計測は tayooo.com（Cloudflare）のサーバーとの間で行います。1回の計測で、回線速度に応じて数MB〜数十MBの通信が発生します。</p>
  </div>

  <div class="card">
    <div class="histhead">
      <h2>HISTORY — 計測履歴</h2>
      <button class="clearbtn" id="clearBtn">履歴を消す</button>
    </div>
    <div id="histList"></div>
    <p class="note">履歴はこの端末のブラウザ内に保存されます（サーバーには送信されません）。最大30件。</p>
  </div>

  <footer><a href="/">© 2026 TAYOOO</a></footer>
</div>

<script>
  const API = '/tool/speedtest';
  const DL_MS = 5000, UL_MS = 5000, DL_STREAMS = 3, UL_STREAMS = 2, UL_CHUNK = 5 * 1024 * 1024;
  const LS_KEY = 'tayooo-speedtest-history';

  const phaseEl = document.getElementById('phase');
  const bigNum = document.getElementById('bigNum');
  const bigUnit = document.getElementById('bigUnit');
  const barFill = document.getElementById('barFill');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  let running = false, aborters = [];
  const pctEl = document.getElementById('pct');
  const legendEl = document.getElementById('legend');
  const graphCv = document.getElementById('graph');
  const gtx = graphCv.getContext('2d');
  let samples = { down: [], up: [] };
  function setProgress(pct) {
    barFill.style.width = pct + '%';
    pctEl.textContent = running || pct >= 100 ? Math.floor(pct) + '%' : '';
  }
  function drawGraph(active) {
    const W = graphCv.width, H = graphCv.height;
    gtx.clearRect(0, 0, W, H);
    const all = samples.down.concat(samples.up);
    const maxV = Math.max(10, (all.length ? Math.max(...all) : 0) * 1.2);
    gtx.strokeStyle = '#EDE4D3'; gtx.lineWidth = 2;
    for (let i = 1; i <= 3; i++) { const y = H - 14 - (H - 28) * i / 3; gtx.beginPath(); gtx.moveTo(6, y); gtx.lineTo(W - 6, y); gtx.stroke(); }
    gtx.fillStyle = '#A79BA8'; gtx.font = '700 17px Consolas, monospace'; gtx.textAlign = 'right';
    gtx.fillText(fmtMbps(maxV) + ' Mbps', W - 10, 20);
    function plot(arr, stroke, fill) {
      if (arr.length < 2) return;
      const stepX = (W - 12) / 24; // 5秒 / 0.2秒 = 25点で幅いっぱい
      gtx.beginPath();
      arr.forEach((v, i) => { const x = 6 + i * stepX, y = H - 14 - (H - 28) * (v / maxV); i ? gtx.lineTo(x, y) : gtx.moveTo(x, y); });
      gtx.strokeStyle = stroke; gtx.lineWidth = 3.5; gtx.lineJoin = 'round'; gtx.stroke();
      if (fill) {
        const lastX = 6 + (arr.length - 1) * stepX;
        gtx.lineTo(lastX, H - 14); gtx.lineTo(6, H - 14); gtx.closePath();
        gtx.fillStyle = fill; gtx.fill();
      }
    }
    if (active === 'down' || !active) plot(samples.down, '#C9502E', 'rgba(225,140,109,0.30)');
    if (active === 'up' || !active) plot(samples.up, '#5D7FA3', 'rgba(126,142,158,0.30)');
    if (!samples.down.length && !samples.up.length) {
      gtx.fillStyle = '#C9C2B4'; gtx.font = '700 19px "Noto Sans JP", sans-serif'; gtx.textAlign = 'center';
      gtx.fillText('計測するとここにグラフが出ます', W / 2, H / 2 + 6);
    }
  }

  function setStat(id, valId, value, unit) {
    document.getElementById(valId).innerHTML = value + '<small> ' + unit + '</small>';
  }
  function markActive(id) {
    ['stPing', 'stJitter', 'stDown', 'stUp'].forEach(x => document.getElementById(x).classList.toggle('on', x === id));
  }
  function fmtMbps(v) { return v >= 100 ? Math.round(v).toString() : v.toFixed(1); }

  async function measurePing() {
    const rtts = [];
    for (let i = 0; i < 11; i++) {
      if (!running) break;
      const t0 = performance.now();
      try { await fetch(API + '/ping?t=' + Date.now() + '-' + i, { cache: 'no-store' }); } catch (e) { }
      const dt = performance.now() - t0;
      if (i > 0) rtts.push(dt); // 最初の1回はウォームアップとして捨てる
      setProgress(i / 11 * 15);
    }
    if (!rtts.length) return { ping: 0, jitter: 0 };
    const sorted = [...rtts].sort((a, b) => a - b);
    const core = sorted.slice(0, Math.max(1, sorted.length - 1)); // 最大の外れ値を1つ捨てる
    const ping = core.reduce((s, x) => s + x, 0) / core.length;
    let jitter = 0;
    for (let i = 1; i < rtts.length; i++) jitter += Math.abs(rtts[i] - rtts[i - 1]);
    jitter = rtts.length > 1 ? jitter / (rtts.length - 1) : 0;
    return { ping, jitter };
  }

  async function measureDownload() {
    let bytes = 0;
    const t0 = performance.now();
    const deadline = t0 + DL_MS;
    async function stream() {
      while (running && performance.now() < deadline) {
        const ctrl = new AbortController();
        aborters.push(ctrl);
        try {
          const res = await fetch(API + '/dl?t=' + Date.now() + '-' + Math.random(), { cache: 'no-store', signal: ctrl.signal });
          const reader = res.body.getReader();
          while (running && performance.now() < deadline) {
            const { done, value } = await reader.read();
            if (done) break;
            bytes += value.byteLength;
          }
          try { reader.cancel(); } catch (e) { }
        } catch (e) { if (!running) break; }
      }
    }
    let lastBytes = 0, lastT = performance.now(), smooth = 0;
    const ui = setInterval(() => {
      const now = performance.now();
      const sec = (now - t0) / 1000;
      if (sec > 0.3) { bigNum.textContent = fmtMbps(bytes * 8 / sec / 1e6); }
      const inst = (bytes - lastBytes) * 8 / ((now - lastT) / 1000) / 1e6;
      smooth = smooth ? smooth * 0.55 + inst * 0.45 : inst;
      samples.down.push(smooth);
      lastBytes = bytes; lastT = now;
      drawGraph('down');
      setProgress(15 + Math.min((now - t0) / DL_MS, 1) * 45);
    }, 200);
    await Promise.all(Array.from({ length: DL_STREAMS }, stream));
    clearInterval(ui);
    const sec = (performance.now() - t0) / 1000;
    return bytes * 8 / sec / 1e6;
  }

  function measureUpload() {
    return new Promise(resolve => {
      const payload = new Blob([new Uint8Array(UL_CHUNK).map(() => Math.random() * 256)], { type: 'application/octet-stream' });
      let sent = 0;
      const t0 = performance.now();
      const deadline = t0 + UL_MS;
      let active = 0, doneFlag = false;
      let lastSent = 0, lastT = performance.now(), smooth = 0;
      const ui = setInterval(() => {
        const now = performance.now();
        const sec = (now - t0) / 1000;
        if (sec > 0.3) bigNum.textContent = fmtMbps(sent * 8 / sec / 1e6);
        const inst = (sent - lastSent) * 8 / ((now - lastT) / 1000) / 1e6;
        smooth = smooth ? smooth * 0.55 + inst * 0.45 : inst;
        samples.up.push(smooth);
        lastSent = sent; lastT = now;
        drawGraph('up');
        setProgress(60 + Math.min((now - t0) / UL_MS, 1) * 40);
      }, 200);
      function finish() {
        if (doneFlag) return;
        doneFlag = true;
        clearInterval(ui);
        const sec = (performance.now() - t0) / 1000;
        resolve(sent * 8 / sec / 1e6);
      }
      function sendOne() {
        if (!running || performance.now() >= deadline) { if (--active <= 0) finish(); return; }
        const xhr = new XMLHttpRequest();
        aborters.push({ abort: () => xhr.abort() });
        let last = 0;
        xhr.upload.onprogress = e => { sent += e.loaded - last; last = e.loaded; };
        xhr.onload = xhr.onerror = xhr.onabort = () => { active--; sendOne(); if (active <= 0 && (!running || performance.now() >= deadline)) finish(); };
        xhr.open('POST', API + '/ul?t=' + Date.now() + '-' + Math.random());
        xhr.send(payload);
      }
      active = UL_STREAMS;
      for (let i = 0; i < UL_STREAMS; i++) sendOne();
      setTimeout(() => { aborters.forEach(a => { try { a.abort(); } catch (e) { } }); finish(); }, UL_MS + 1500);
    });
  }

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch (e) { return []; }
  }
  function renderHistory() {
    const list = document.getElementById('histList');
    const items = loadHistory();
    if (!items.length) { list.innerHTML = '<div class="empty">まだ履歴がありません</div>'; return; }
    list.innerHTML = items.map(h => {
      const d = new Date(h.t);
      const ds = (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      return '<div class="hrow"><div class="date">' + ds + '</div><div class="vals">' +
        '<span><span class="lab">PING</span>' + h.ping + 'ms</span>' +
        '<span><span class="lab">下り</span><b>' + h.down + '</b>Mbps</span>' +
        '<span><span class="lab">上り</span>' + h.up + 'Mbps</span></div></div>';
    }).join('');
  }
  function saveHistory(rec) {
    const items = loadHistory();
    items.unshift(rec);
    try { localStorage.setItem(LS_KEY, JSON.stringify(items.slice(0, 30))); } catch (e) { }
    renderHistory();
  }
  document.getElementById('clearBtn').addEventListener('click', () => {
    localStorage.removeItem(LS_KEY);
    renderHistory();
  });

  async function run() {
    running = true; aborters = [];
    samples = { down: [], up: [] };
    legendEl.classList.remove('on');
    pctEl.textContent = '0%';
    drawGraph('down');
    startBtn.disabled = true; stopBtn.disabled = false;
    startBtn.textContent = '計測中…';
    setStat('vPing', 'vPing', '—', 'ms'); setStat('vJitter', 'vJitter', '—', 'ms');
    setStat('vDown', 'vDown', '—', 'Mbps'); setStat('vUp', 'vUp', '—', 'Mbps');

    phaseEl.textContent = 'PING — 応答速度を計測中';
    markActive('stPing');
    bigNum.textContent = '—'; bigUnit.textContent = '';
    const { ping, jitter } = await measurePing();
    if (!running) return cleanup();
    setStat('vPing', 'vPing', Math.round(ping), 'ms');
    setStat('vJitter', 'vJitter', Math.round(jitter), 'ms');
    markActive('stJitter');

    phaseEl.textContent = 'DOWNLOAD — 下り速度を計測中';
    markActive('stDown');
    bigUnit.textContent = ' Mbps';
    const down = await measureDownload();
    if (!running) return cleanup();
    setStat('vDown', 'vDown', fmtMbps(down), 'Mbps');

    phaseEl.textContent = 'UPLOAD — 上り速度を計測中';
    markActive('stUp');
    const up = await measureUpload();
    if (!running) return cleanup();
    setStat('vUp', 'vUp', fmtMbps(up), 'Mbps');

    setProgress(100);
    legendEl.classList.add('on');
    drawGraph(null);
    phaseEl.textContent = 'DONE — 計測完了';
    markActive('');
    bigNum.textContent = fmtMbps(down); bigUnit.textContent = ' Mbps（下り）';
    saveHistory({ t: Date.now(), ping: Math.round(ping), jitter: Math.round(jitter), down: Number(fmtMbps(down)), up: Number(fmtMbps(up)) });
    cleanup();
  }
  function cleanup() {
    running = false;
    aborters.forEach(a => { try { a.abort(); } catch (e) { } });
    aborters = [];
    startBtn.disabled = false; stopBtn.disabled = true;
    startBtn.textContent = 'もう一度測定する';
    markActive('');
  }
  startBtn.addEventListener('click', run);
  stopBtn.addEventListener('click', () => { phaseEl.textContent = 'STOPPED — 中止しました'; cleanup(); });

  drawGraph('down');
  renderHistory();
</script>
<script src="/season.js" defer></script>
</body>
</html>
