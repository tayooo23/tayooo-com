<!DOCTYPE html>

<style>
  :root{--sky:#7e8e9e;--mauve:#857a80;--salmon:#e18c6d;--brown:#875e5c;--ink:#23233F;--paper:#FAF5EE;--grid:rgba(225,140,109,.28);}
  @font-face{font-family:"DT Getai Grotesk Display";src:url("../fonts/DTGetaiGroteskDisplay-Black.woff") format("woff");font-weight:900;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{overflow-x:hidden;}
  body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;background:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),var(--paper);background-size:26px 26px;color:var(--ink);-webkit-font-smoothing:antialiased;}
  a{text-decoration:none;color:inherit;}
  .wrap{max-width:880px;margin:0 auto;padding:30px 32px 40px;}
  .hero{background:linear-gradient(180deg,#7e8e9e 0%,#857a80 58%,#e18c6d 100%);border:2.5px solid var(--ink);border-radius:20px;box-shadow:9px 9px 0 var(--ink);padding:26px 38px 0;color:#fff;overflow:hidden;position:relative;}
  .hero .kicker{font-family:Consolas,monospace;font-size:12px;letter-spacing:.35em;font-weight:700;color:#FFF1E2;}
  .hero .back{position:absolute;top:24px;right:38px;font-size:12.5px;font-weight:700;color:#FFF1E2;}
  .hero .back:hover{color:#fff;text-decoration:underline;}
  .hero h1{font-family:"DT Getai Grotesk Display","Noto Sans JP",sans-serif;font-size:56px;font-weight:900;line-height:1.02;margin-top:6px;color:#fff;}
  .hero h1 .dot{color:#FFD9AE;}
  .hero p{margin-top:8px;font-size:14px;font-weight:700;color:#FFF6EC;}
  .mountains{display:block;width:calc(100% + 76px);margin:10px -38px 0;height:70px;}
  footer{margin-top:40px;text-align:center;font-family:Consolas,monospace;font-size:11.5px;letter-spacing:.18em;color:#A79BA8;}
  footer a:hover{color:#C9502E;}
  @media (max-width:700px){.wrap{padding:16px 14px 26px;}.hero{padding:18px 20px 0;box-shadow:6px 6px 0 var(--ink);border-radius:16px;}.hero .back{top:16px;right:20px;}.hero h1{font-size:38px;}.mountains{width:calc(100% + 40px);margin:6px -20px 0;height:48px;}}

  .tools{display:flex;flex-direction:column;gap:16px;margin-top:30px;}
  .tool{background:#fff;border:2.5px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);padding:14px 22px;display:flex;flex-direction:column;gap:3px;transition:transform .12s ease,box-shadow .12s ease;}
  .tool:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink);}
  .tool .head{display:flex;align-items:baseline;gap:14px;}
  .tool .no{font-family:Consolas,monospace;font-size:12.5px;color:#A79BA8;white-space:nowrap;}
  .tool .ttl{font-size:16px;font-weight:900;line-height:1.45;}
  .tool .desc{font-size:12.5px;font-weight:500;color:#6E6A7E;}
  @media (max-width:700px){.tool{padding:12px 16px;}}
</style>
</head>

<body>
<div class="wrap">

      <path d="M-10,128 L236,128 L318,88 L372,108 L442,70 L522,110 L598,64 L672,104 L740,80 L816,114 L884,94 L1010,118" stroke="#FFF3E2" stroke-width="2.4" opacity="0.95"/>
    </svg>
  </div>
  <main class="tools">

</div>
